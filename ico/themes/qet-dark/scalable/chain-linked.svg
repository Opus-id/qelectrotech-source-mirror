<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs id="defs3051">
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text {
        color:#dcdcdc;
      }
      </style>
  </defs>
  <!-- three links of a chain: the middle one, seen edge on, through the two others -->
  <g transform="rotate(-45 12 12)" class="ColorScheme-Text">
    <rect x="0" y="8.5" width="10" height="7" rx="3.5" style="fill:none;stroke:currentColor;stroke-width:2"/>
    <rect x="14" y="8.5" width="10" height="7" rx="3.5" style="fill:none;stroke:currentColor;stroke-width:2"/>
    <rect x="5" y="10.5" width="14" height="3" rx="1.5" style="fill:currentColor"/>
  </g>
</svg>
